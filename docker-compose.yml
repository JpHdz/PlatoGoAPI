services:
  api:
    build: ./back
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - DATABASE=mongodb://mongo:27017/platogo
      - DATABASE_PASSWORD=password
    depends_on:
      - mongo
    networks:
      - appnet
  web:
    build: ./front
    ports:
      - "80:80"
    environment:
      - API_URL=http://localhost:4000/api/v1
      - SOCKET_URL=http://localhost:4000
    depends_on:
      - api
    networks:
      - appnet
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - appnet
networks:
  appnet:
    driver: bridge
